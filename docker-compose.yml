services:
  postgres:
    image: postgres:15
    container_name: oil_postgres
    environment:
      POSTGRES_DB: oil_gas_db
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst123
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d oil_gas_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oil_gas_network

  minio:
    image: minio/minio:latest
    container_name: oil_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - oil_gas_network

  jupyter:
    image: jupyter/datascience-notebook:latest
    container_name: oil_jupyter
    environment:
      JUPYTER_ENABLE_LAB: "yes"
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      bash -c "
      pip install --no-cache-dir psycopg2-binary sqlalchemy pandas numpy matplotlib seaborn scikit-learn boto3 pyarrow fastparquet plotly &&
      start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''
      "
    networks:
      - oil_gas_network

  superset:
    image: amancevice/superset:latest
    container_name: oil_superset
    user: root
    environment:
      SUPERSET_SECRET_KEY: 'superset'
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./superset_data:/app/superset_home
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    command: >
      bash -c "
      apt-get update && apt-get install -y python3-psycopg2 &&
      ln -sf /usr/lib/python3/dist-packages/psycopg2* /app/.venv/lib/python3.10/site-packages/ 2>/dev/null || true &&
      
      python -c 'import psycopg2; print(\"psycopg2 OK\")' &&
      
      echo 'Creating admin user...' &&
      superset fab create-admin \
        --username admin \
        --firstname Admin \
        --lastname User \
        --email admin@example.com \
        --password admin || true &&
      
      echo 'Upgrading database...' &&
      superset db upgrade &&
      
      echo 'Initializing Superset...' &&
      superset init &&
      
      echo 'Starting Superset server...' &&
      superset run -h 0.0.0.0 -p 8088 --with-threads --reload --debugger
      "
    networks:
      - oil_gas_network

networks:
  oil_gas_network:
    driver: bridge